<!-- CUSTOMIZE SECTION -->


<section class="customize-page">



<div class="checkout-box">



<h1>
Customize Your Gift 🎁
</h1>



<p class="customize-text">

Create a unique gift for your loved ones ❤️

</p>






<form id="customize-form">





<label>
Choose Gift Category
</label>



<select name="category">


<option>
Gift Hamper
</option>


<option>
Watch
</option>


<option>
Bracelet
</option>


<option>
Shirt
</option>


<option>
Mug
</option>


<option>
Pillow
</option>


<option>
Photo Frame
</option>


<option>
Teddy
</option>


<option>
Chocolate Box
</option>


<option>
Couple Gift Box
</option>


</select>








<label>
Your Name
</label>


<input 
type="text"
name="name"
placeholder="Enter Your Name"
required>







<label>
Receiver's Name
</label>


<input

type="text"

name="receiver"

placeholder="Enter Receiver's Name"

required>







<label>
Write Message On Gift
</label>


<textarea

name="message"

placeholder="Write your message...">

</textarea>







<label>
Choose Gift Color
</label>


<input

type="color"

name="color">








<label>
Upload Photo
</label>


<input

type="file"

name="photo">







<label>
Special Instructions
</label>


<textarea

name="instructions"

placeholder="Any special requirements...">

</textarea>







<button type="submit">

Submit Custom Order 🎁

</button>





</form>
